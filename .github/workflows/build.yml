name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ZzzAutoSign.sln

      - name: Build
        run: dotnet build ZzzAutoSign.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/ZzzAutoSign.Tests/ZzzAutoSign.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish main app (single file)
        run: >
          dotnet publish src/ZzzAutoSign/ZzzAutoSign.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/ZzzAutoSign

      - name: Publish credential grabber (single file)
        run: >
          dotnet publish src/CredentialGrabber/CredentialGrabber.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/CredentialGrabber

      - name: Show publish output
        shell: pwsh
        run: |
          Write-Host "=== ZzzAutoSign ==="
          Get-ChildItem publish/ZzzAutoSign | Select-Object Name, Length
          Write-Host "=== CredentialGrabber ==="
          Get-ChildItem publish/CredentialGrabber | Select-Object Name, Length

      - name: Verify Playwright driver is present
        shell: pwsh
        run: |
          # Publishing as a single file silently drops .playwright\node\win32_x64\node.exe:
          # it gets classified as a "native library" and removed from the publish list,
          # yet it is never actually bundled into the exe. package\ and LICENSE survive,
          # so the output directory looks fine and the app only fails at runtime with
          # "Driver not found". Assert it here instead of shipping a broken build.
          # See EnsurePlaywrightDriverIsPublished in src/CredentialGrabber/CredentialGrabber.csproj.
          $driver = "publish/CredentialGrabber/.playwright/node/win32_x64/node.exe"
          if (-not (Test-Path $driver)) {
            throw "Playwright driver missing: $driver"
          }
          $size = (Get-Item $driver).Length
          Write-Host "Playwright driver OK: $driver ($size bytes)"
          if ($size -lt 10MB) {
            throw "Playwright driver looks truncated: $size bytes"
          }
          # Playwright's targets fall back to copying *every* platform's node binary
          # when it cannot infer the platform, silently adding ~388 MB of darwin/linux
          # runtimes. Only win32_x64 may exist here.
          # See the PlaywrightPlatform property in src/CredentialGrabber/CredentialGrabber.csproj.
          $others = Get-ChildItem "publish/CredentialGrabber/.playwright/node" -Directory |
                    Where-Object { $_.Name -ne "win32_x64" }
          if ($others) {
            throw "unexpected non-Windows Playwright node runtimes: $($others.Name -join ', ')"
          }
          Write-Host "Playwright node runtimes OK: only win32_x64 present"

      - name: Verify packaged files are the usable ones
        shell: pwsh
        run: |
          # playwright.ps1 comes from the Playwright NuGet package and loads
          # Microsoft.Playwright.dll from disk. Single-file publish bundles that dll
          # into the exe, so the script can never succeed here - it only throws
          # FileNotFoundException + TypeNotFound and sends users chasing a dead end.
          # It is dropped by DropBrokenPlaywrightScript in CredentialGrabber.csproj,
          # and install-browser.cmd (which drives the bundled node directly) takes
          # its place.
          $broken = "publish/CredentialGrabber/playwright.ps1"
          if (Test-Path $broken) {
            throw "playwright.ps1 must not be shipped, it cannot work under single-file publish: $broken"
          }
          $helper = "publish/CredentialGrabber/install-browser.cmd"
          if (-not (Test-Path $helper)) {
            throw "install-browser.cmd missing: $helper"
          }
          # MIT 要求在分发副本里带上许可与版权声明，两个包的 publish 目录都必须有 LICENSE。
          foreach ($pkg in @("publish/ZzzAutoSign", "publish/CredentialGrabber")) {
            $lic = "$pkg/LICENSE"
            if (-not (Test-Path $lic)) {
              throw "LICENSE missing from $pkg - do not ship a binary without its license text"
            }
            if (-not (Select-String -Path $lic -Pattern "MIT License" -Quiet)) {
              throw "$lic does not look like the MIT license"
            }
          }
          Write-Host "LICENSE present in both packages"
          Write-Host "Packaged files OK: install-browser.cmd present, playwright.ps1 absent"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zzz-auto-sign-${{ github.sha }}
          path: publish/
          retention-days: 14
