name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ github.event.inputs.tag }}'
          } else {
            $v = '${{ github.ref_name }}'
          }
          $v = $v.TrimStart('v')
          Write-Host "Version = $v"
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore ZzzAutoSign.sln

      - name: Test
        run: dotnet test tests/ZzzAutoSign.Tests/ZzzAutoSign.Tests.csproj -c Release

      - name: Publish main app
        run: >
          dotnet publish src/ZzzAutoSign/ZzzAutoSign.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.value }}
          -o publish/ZzzAutoSign

      - name: Publish credential grabber
        run: >
          dotnet publish src/CredentialGrabber/CredentialGrabber.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.value }}
          -o publish/CredentialGrabber

      - name: Verify Playwright driver is present
        shell: pwsh
        run: |
          # Publishing as a single file silently drops .playwright\node\win32_x64\node.exe:
          # it gets classified as a "native library" and removed from the publish list,
          # yet it is never actually bundled into the exe. package\ and LICENSE survive,
          # so the output directory looks fine and the app only fails at runtime with
          # "Driver not found". Never build a release without this file.
          # See EnsurePlaywrightDriverIsPublished in src/CredentialGrabber/CredentialGrabber.csproj.
          $driver = "publish/CredentialGrabber/.playwright/node/win32_x64/node.exe"
          if (-not (Test-Path $driver)) {
            throw "Playwright driver missing: $driver"
          }
          $size = (Get-Item $driver).Length
          Write-Host "Playwright driver OK: $driver ($size bytes)"
          if ($size -lt 10MB) {
            throw "Playwright driver looks truncated: $size bytes"
          }
          # Playwright's targets fall back to copying *every* platform's node binary
          # when it cannot infer the platform, silently adding ~388 MB of darwin/linux
          # runtimes. Only win32_x64 may exist here.
          # See the PlaywrightPlatform property in src/CredentialGrabber/CredentialGrabber.csproj.
          $others = Get-ChildItem "publish/CredentialGrabber/.playwright/node" -Directory |
                    Where-Object { $_.Name -ne "win32_x64" }
          if ($others) {
            throw "unexpected non-Windows Playwright node runtimes: $($others.Name -join ', ')"
          }
          Write-Host "Playwright node runtimes OK: only win32_x64 present"

      - name: Verify packaged files are the usable ones
        shell: pwsh
        run: |
          # See the matching step in build.yml. playwright.ps1 cannot work under
          # single-file publish, so it must never reach a release archive.
          $broken = "publish/CredentialGrabber/playwright.ps1"
          if (Test-Path $broken) {
            throw "playwright.ps1 must not be shipped, it cannot work under single-file publish: $broken"
          }
          $helper = "publish/CredentialGrabber/install-browser.cmd"
          if (-not (Test-Path $helper)) {
            throw "install-browser.cmd missing: $helper"
          }
          Write-Host "Packaged files OK: install-browser.cmd present, playwright.ps1 absent"

      - name: Package release archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # 主程序包
          Compress-Archive -Path publish/ZzzAutoSign/* -DestinationPath dist/ZzzAutoSign-win-x64.zip -Force

          # 凭证提取工具包
          Compress-Archive -Path publish/CredentialGrabber/* -DestinationPath dist/CredentialGrabber-win-x64.zip -Force

          # 校验和
          #
          # 必须写 LF 且不带 BOM。原先用 Set-Content -Encoding utf8，在 Windows 上
          # 会写成 CRLF：文件名后面被挂上一个 \r，用户拿
          # `sha256sum -c SHA256SUMS.txt`（Git Bash / WSL，很常见的做法）会得到
          # "FAILED open or read" —— 摘要其实全对，是行尾让标准工具读不出来，
          # 看起来却像附件损坏。v1.0.2 就发过一份这样的，见 docs/排障手册.md。
          $lines = Get-ChildItem dist/*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $sumsPath = Join-Path $PWD "dist/SHA256SUMS.txt"
          [System.IO.File]::WriteAllText(
            $sumsPath,
            ($lines -join "`n") + "`n",
            [System.Text.UTF8Encoding]::new($false))

          # 断言确实是 LF 且无 BOM，别再静默退回 CRLF
          $raw = [System.IO.File]::ReadAllBytes($sumsPath)
          if ($raw -contains 13) {
            throw "SHA256SUMS.txt must use LF line endings (found CR)"
          }
          if ($raw.Length -ge 3 -and $raw[0] -eq 0xEF -and $raw[1] -eq 0xBB -and $raw[2] -eq 0xBF) {
            throw "SHA256SUMS.txt must not have a UTF-8 BOM"
          }
          Write-Host "SHA256SUMS.txt OK: $($raw.Length) bytes, LF, no BOM"
          Get-Content $sumsPath

      - name: Prepare release notes
        id: notes
        shell: pwsh
        run: |
          # 说明文案放在 docs/release-notes/ 下的 md 里，工作流只做替换与复制，
          # 避免中文经由 YAML -> PowerShell 的编码往返出问题。
          $tag = "v${{ steps.version.outputs.value }}"
          $custom = "docs/release-notes/$tag.md"
          if (-not (Test-Path $custom)) {
            Write-Host "no docs/release-notes/$tag.md, falling back to _fallback.md"
            $custom = "docs/release-notes/_fallback.md"
          }
          $out = "dist/RELEASE_BODY.md"
          $text = (Get-Content $custom -Raw -Encoding UTF8).Replace("{{TAG}}", $tag)
          [System.IO.File]::WriteAllText($out, $text, [System.Text.UTF8Encoding]::new($false))
          Write-Host "release body <- $custom ($($text.Length) chars)"
          "path=$out" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 直接发布为正式 Release（原先为 draft，需要手动点一次 Publish 才公开）
          name: ZzzAutoSign v${{ steps.version.outputs.value }}
          draft: false
          # 正文取自 docs/release-notes/v<版本>.md。
          # 不能只靠 generate_release_notes：它只根据「已合并的 PR」生成 What's Changed，
          # 而本仓库都是直推 main、没有 PR，结果正文会是空的。
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
